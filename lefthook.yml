# lefthook — pre-commit checks.
#
# Install once:
#   brew install lefthook    # or:  npm install -g lefthook
#   lefthook install
#
# Or run the bundled bootstrap:
#   ./scripts/setup-hooks.sh
#
# What it does, by what you touched:
# - Python in server/ or tests/  → ruff, mypy, and the hermetic pytest tier
# - TS in web/src/               → eslint, tsc --noEmit, and the vitest suite
# - routes or pydantic models    → the generated contracts.ts drift check
# - nothing relevant (docs only) → nothing runs
#
# All four are fast enough for a per-commit gate (~40s worst case, and each
# only fires when its own files moved). `./scripts/check.sh` runs the same
# set unconditionally, plus `--e2e` for Playwright.
#
# `ruff format` is not run by any gate — see the note in scripts/check.sh.

pre-commit:
  parallel: true
  commands:
    ruff:
      tags: backend
      glob: "{server,tests}/**/*.py"
      run: .venv/bin/ruff check .
      fail_text: "Ruff found problems. Run '.venv/bin/ruff check .' (many are auto-fixable with --fix)."

    mypy:
      tags: backend
      glob: "server/**/*.py"
      run: .venv/bin/mypy
      fail_text: "mypy found type errors. Run '.venv/bin/mypy' for detail."

    eslint:
      tags: frontend
      glob: "web/{src,e2e}/**/*.{ts,tsx}"
      run: cd web && bun run lint
      fail_text: "ESLint found problems. Run 'cd web && bun run lint' for detail."

    tsc:
      tags: frontend
      glob: "web/src/**/*.{ts,tsx}"
      run: cd web && bun run typecheck
      fail_text: "TypeScript errors. Run 'cd web && bun run typecheck' for detail."

    vitest:
      tags: frontend
      glob: "web/src/**/*.{ts,tsx}"
      run: cd web && bun run test
      fail_text: "Frontend tests failed. Run 'cd web && bun run test' for detail."

    pytest:
      tags: backend
      # -m "not real" is the hermetic tier: 1174 tests, ~34s, no CLI and no
      # model. Without it this hook ran the live-model tests too, which made a
      # commit depend on a signed-in CLI and the provider being up.
      glob: "{server,tests}/**/*.py"
      run: .venv/bin/pytest tests/ -m "not real" -q --tb=short
      fail_text: "Backend tests failed. Run '.venv/bin/pytest tests/ -m \"not real\" -v' for detail."

    architecture-nag:
      tags: backend
      glob: "server/**/*.py"
      run: ./scripts/nag-architecture.sh

    contracts:
      tags: backend
      # web/src/api/contracts.ts is generated from the OpenAPI schema; these
      # are the files that can invalidate it.
      glob: "server/{models.py,main.py,routers/**/*.py}"
      run: ./scripts/check-contracts.sh
      fail_text: "contracts.ts is stale. Run 'cd web && bun run generate:contracts'."
