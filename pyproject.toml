[project]
name = "octopus"
version = "0.1.0"
description = "Remote Claude Code controller"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "mcp>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
octopus = "server.cli:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
# server/ and tests/ are the hand-written Python; .venv and generated
# artefacts are not ours to lint.
target-version = "py312"
line-length = 88
exclude = [".venv", "web", "docs"]

[tool.ruff.lint]
# Deliberately a narrow starting set: pyflakes (real errors), pycodestyle,
# isort, pyupgrade, flake8-bugbear. Broad rule sets on 28k lines of working
# code produce a wall of stylistic noise that nobody reads, which is how a
# linter becomes decoration. Widen this once the current set is clean.
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    # The codebase uses long explanatory comments and prose docstrings that
    # read better unwrapped than hard-folded at 88 columns. Code length is
    # still enforced by the formatter.
    "E501",

    # raise-without-from-inside-except. NOT a backlog item — a policy call.
    # There are 86 sites and they split between two different correct
    # answers: `server/harness/*` re-raises domain errors where `from e`
    # belongs, while `server/routers/*` deliberately converts an internal
    # exception into an HTTPException response, where `from None` is the
    # more honest form. Ruff cannot fix either automatically (not even
    # under --unsafe-fixes), so enforcing it would mean 86 per-site
    # judgements. Inserting `from e` blindly across all of them would look
    # like quality without being it.
    "B904",

    # replace-str-enum. `class SessionStatus(str, Enum)` appears 13 times,
    # several in `server/models.py`, where the members are serialized into
    # API responses and thence into the generated web/src/api/contracts.ts.
    # StrEnum differs from (str, Enum) in __str__/__format__ behavior, so
    # this "modernization" can change wire output. Not worth the risk for a
    # cosmetic gain.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Several MCP server modules must set sys.path / env before importing the
# package, so their imports legitimately come after executable statements.
"server/mcp_servers/*.py" = ["E402"]
"server/mcp_servers/connectors/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# `Depends()` in an argument default IS the FastAPI idiom — B008 is a false
# positive on every dependency-injected route and on the shared auth helper.
"server/auth.py" = ["B008"]
"server/routers/*.py" = ["B008"]
"server/app_agent.py" = ["B008"]

[tool.mypy]
# Non-strict on purpose (docs/plans/polish-2026-09.md §8 F1). The annotations
# are thorough — 89% return coverage — but were never checked, so a strict
# first run would be a tarpit that stalls the A1 refactor instead of enabling
# it. Ratchet these on once the baseline is clean.
python_version = "3.12"
files = ["server"]
exclude = ["^\\.venv/", "^web/"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
# The two that catch real defects without demanding new annotations:
warn_redundant_casts = true
no_implicit_optional = true

# Enabling mypy on 28k previously-unchecked lines found 316 errors. 246 were
# fixed in the F1 commit; six codes held the residue. Three of those six are
# now enforced too — `has-type` (its cause went with A1's extraction),
# `assignment` (two injected globals and one tuple now say they can be None)
# and `index` (three `SELECT COUNT(*)` call sites went through one `_count`
# helper instead of indexing a `Row | None`). Three remain below, each with a
# reason that is a decision rather than a delay. Everything NOT listed is
# enforced — including `return-value`, which was cleared, and
# `unused-coroutine`, which caught a real bug (an un-awaited approve_tool that
# made Telegram's Allow/Deny buttons silently do nothing).
disable_error_code = [
    # 26 remaining, and every one of them is a single attribute:
    # `SessionManager.db`, typed `Database | None` because it is assigned in
    # `initialize()` rather than `__init__`. The 16 errors that were NOT that
    # attribute are fixed — one of them a latent `AttributeError` on credential
    # delete. What is left is one initialization contract across 203 `self.db`
    # reads, 46 of which guard with `if self.db:`. An asserting property (the
    # `Database.conn` trick) would turn those 46 silent skips into raises,
    # which is arguably more correct and is certainly a change in production
    # failure modes — so it is a decision to take deliberately, not a tidy-up
    # to slip into a polish pass. Sized and recorded in the plan's §11.
    "union-attr",
    # 8 remaining, after five were fixed — including a `create_session`
    # signature that claimed `agent_id: str` while both the model and the column
    # are nullable, and an `AgentRead(**agent)` that would have raised inside a
    # 500 if the row had gone. What is left is two shapes, neither a delay:
    # five are a `str` out of a DB row reaching a field typed as an enum
    # (BackendKind, CredentialStatus, AuthType), where Pydantic already
    # validates at runtime and the alternative is threading enums through the
    # row dicts; two are aiosqlite's own stubs typing a cursor as
    # `Iterable[Row]` where `Sized` is wanted; one is a callback whose
    # implementation returns a bool the protocol does not ask for.
    "arg-type",
    # 2 remaining, both "Cannot infer type of lambda" where a lambda carries a
    # `x=value` parameter to capture a value at definition time. A lambda's
    # parameters cannot be annotated, so the only way to satisfy this is to
    # rewrite working closures into named functions to please an inference
    # limitation. Left alone on purpose.
    "misc",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
# The real-CLI tier. `real` is the umbrella every tests/*_real.py file
# carries, so `-m "not real"` is the hermetic tier (1,147 of 1,181 tests)
# — it replaces hand-listing --ignore for each file. The rest say WHICH
# CLI a test needs and how strongly: `*_bin` wants only the binary on
# PATH (a login test must NOT require being logged in), `real_claude` /
# `real_codex` want one that is signed in and actually answers.
#
# These are markers rather than module-level skipif calls so the probe
# happens in pytest_runtest_setup (tests/conftest.py) instead of at
# import: evaluating them during collection made plain `--collect-only`
# spawn a real `claude --print` (0.80 s hermetic vs 16.44 s full).
markers = [
    "real: talks to a real CLI/model; deselect with -m 'not real'",
    "real_claude: needs a claude CLI that is installed AND signed in",
    "real_codex: needs a codex CLI that is installed AND signed in",
    "claude_bin: needs only the claude binary on PATH, not a login",
    "codex_bin: needs only the codex binary on PATH, not a login",
]
